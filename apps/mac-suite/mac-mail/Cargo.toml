[package]
name = "mac-mail"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Three-pane mail client"

[dependencies]
ammonia = "4"
base64 = "0.22"
ego-tree = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico", "bmp"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
jiff.workspace = true
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "hostname"] }
libcosmic = { workspace = true, features = ["rfd"] }
mac-appmenu = { path = "../mac-appmenu" }
mac-oauth = { path = "../mac-oauth", features = ["imap"] }
mail-parser = "1.0.1"
open = "5"
scraper = { version = "0.29", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ureq = "3"
url = "2"
