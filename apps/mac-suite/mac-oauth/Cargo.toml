[package]
name = "mac-oauth"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "OAuth2 PKCE loopback sign-in shared by the mac-suite apps"

[features]
imap = ["dep:imap"]

[dependencies]
base64 = "0.22"
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"], optional = true }
open = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "3"
url = "2"
