[package]
name = "mac-quicklook"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Quick Look: floating file preview window"

[dependencies]
libcosmic = { workspace = true, features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
jiff.workspace = true
mime_guess = "2"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-onig"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
