[package]
name = "mac-screenshot"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "macOS-style screenshot tool: capture overlay, toolbar and floating thumbnail"

[dependencies]
cctk = { git = "https://github.com/pop-os/cosmic-protocols", package = "cosmic-client-toolkit", rev = "c0cff4d" }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
jiff.workspace = true
libcosmic.workspace = true
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }
thiserror = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
wl-clipboard-rs = "0.9"
zbus = { version = "5", default-features = false, features = ["tokio"] }
