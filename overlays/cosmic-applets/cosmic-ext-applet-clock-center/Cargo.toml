[package]
name = "cosmic-ext-applet-clock-center"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Clock applet with calendar, now-playing controls and notifications in one popup"

[dependencies]
anyhow.workspace = true
cosmic-applets-config.workspace = true
cosmic-notifications-config = { git = "https://github.com/pop-os/cosmic-notifications" }
cosmic-notifications-util = { git = "https://github.com/pop-os/cosmic-notifications" }
futures-util = { workspace = true, features = ["sink"] }
i18n-embed-fl.workspace = true
i18n-embed.workspace = true
icu = { version = "2.1.1", features = ["compiled_data"] }
jiff = "0.2"
libcosmic.workspace = true
logind-zbus = "5.3.2"
mpris2-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
rust-embed.workspace = true
timedate-zbus = { git = "https://github.com/pop-os/dbus-settings-bindings" }
tokio.workspace = true
tracing-log.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
url = "2.5.8"
urlencoding = "2.1.3"
zbus = { workspace = true, features = ["tokio", "p2p"] }
